name: Sync latest NV from sinavm

on:
  workflow_dispatch:
  schedule:
    - cron: '20 */2 * * *'
  repository_dispatch:
    types: [sync-nv]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download latest NVPS from sinavm/sinavm
        run: |
          set -euo pipefail
          META="https://raw.githubusercontent.com/sinavm/sinavm/main/media/latest-nv.json"
          SRC="https://raw.githubusercontent.com/sinavm/sinavm/main/media/nv-latest-1.npvs"
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 -o /tmp/latest-nv.json "$META"
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 -o /tmp/latest.npvs "$SRC"
          python3 - <<'PY'
          import json
          from pathlib import Path
          items = json.loads(Path('/tmp/latest-nv.json').read_text(encoding='utf-8'))
          if not items:
              raise SystemExit('no NV attachment metadata found')
          item = items[0]
          original_name = item.get('original_name') or item.get('filename') or ''
          ext = Path(original_name).suffix.lower()
          if ext not in {'.npvs', '.nvps', '.npv', '.npvt'}:
              raise SystemExit(f'refusing non-NV attachment: {original_name!r}')
          data = Path('/tmp/latest.npvs').read_bytes()
          if len(data) < 100:
              raise SystemExit(f'invalid config size: {len(data)} bytes')
          print(f'validated NV attachment id={item.get("id")} name={original_name!r} bytes={len(data)}')
          PY
          cp /tmp/latest.npvs sinavm.npvs
          cp /tmp/latest.npvs sinavm-nv_01.npv
          date -u +"%Y-%m-%dT%H:%M:%SZ" > LAST_SYNC.txt
          echo "source=$SRC" >> LAST_SYNC.txt
      - name: Commit if changed
        run: |
          git config user.name sinavm
          git config user.email sina.bb2006@gmail.com
          git add sinavm.npvs sinavm-nv_01.npv LAST_SYNC.txt
          git rm -f --ignore-unmatch melishekan.npvs melishekan-nv_01.npv || true
          git commit -m "sync: latest NVPS from sinavm/sinavm" || echo nochange
          git push
