name: Sync latest configs from sinavm

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-latest-nv.yml"
  schedule:
    - cron: '20 */2 * * *'
  repository_dispatch:
    types: [sync-nv]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download latest NVPS from sinavm/sinavm
        run: |
          set -euo pipefail
          META="https://raw.githubusercontent.com/sinavm/sinavm/main/media/latest-nv.json"
          SRC="https://raw.githubusercontent.com/sinavm/sinavm/main/media/nv-latest-1.npvs"
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 -o /tmp/latest-nv.json "$META"
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 -o /tmp/latest.npvs "$SRC"
          python3 - <<'PY'
          import json
          from pathlib import Path
          items = json.loads(Path('/tmp/latest-nv.json').read_text(encoding='utf-8'))
          if not items:
              raise SystemExit('no NV attachment metadata found')
          item = items[0]
          original_name = item.get('original_name') or item.get('filename') or ''
          ext = Path(original_name).suffix.lower()
          if ext not in {'.npvs', '.nvps', '.npv', '.npvt'}:
              raise SystemExit(f'refusing non-NV attachment: {original_name!r}')
          data = Path('/tmp/latest.npvs').read_bytes()
          if len(data) < 100:
              raise SystemExit(f'invalid config size: {len(data)} bytes')
          print(f'validated NV attachment id={item.get("id")} name={original_name!r} bytes={len(data)}')
          PY
          cp /tmp/latest.npvs sinavm.npvs
          cp /tmp/latest.npvs sinavm-nv_01.npv
          date -u +"%Y-%m-%dT%H:%M:%SZ" > LAST_SYNC.txt
          echo "source=$SRC" >> LAST_SYNC.txt
      - name: Sync HTTP Custom configs
        run: |
          set -euo pipefail
          mkdir -p hc
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 -o /tmp/latest-hc.json "https://raw.githubusercontent.com/sinavm/sinavm/main/media/latest-hc.json"
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          source = json.loads(Path('/tmp/latest-hc.json').read_text(encoding='utf-8'))
          folder = Path('hc')
          for old in folder.glob('hc-*.hc*'):
              old.unlink()
          published = []
          for i, item in enumerate(source[:5], 1):
              original = item.get('original_name') or item.get('filename') or ''
              ext = Path(original).suffix.lower()
              if ext not in {'.hc', '.hct', '.hcconf'}:
                  continue
              media_path = item.get('url') or ''
              if not media_path.startswith('media/'):
                  continue
              raw_url = 'https://raw.githubusercontent.com/sinavm/sinavm/main/' + media_path
              request = urllib.request.Request(raw_url, headers={'User-Agent': 'SiNAVM-config-sync'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  data = response.read()
              if len(data) < 100:
                  raise SystemExit(f'invalid HTTP Custom file: {original!r} ({len(data)} bytes)')
              filename = f'hc-{i:02d}{ext}'
              (folder / filename).write_bytes(data)
              published.append({
                  'id': item.get('id'),
                  'name': original or filename,
                  'filename': filename,
                  'download': filename,
                  'size': len(data),
                  'date': item.get('date'),
                  'date_label': item.get('date_label'),
                  'password': item.get('password') or '@sinavm',
                  'source': item.get('link') or 'https://t.me/sinavm'
              })
          (folder / 'index.json').write_text(json.dumps(published, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'published {len(published)} HTTP Custom configs')
          PY
      - name: Sync OpenVPN configs
        run: |
          set -euo pipefail
          mkdir -p openvpn
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 -o /tmp/latest-openvpn.json "https://raw.githubusercontent.com/sinavm/sinavm/main/media/latest-openvpn.json"
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          source = json.loads(Path('/tmp/latest-openvpn.json').read_text(encoding='utf-8'))
          folder = Path('openvpn')
          for old in folder.glob('openvpn-*.ovpn'):
              old.unlink()
          published = []
          for i, item in enumerate(source[:5], 1):
              media_path = item.get('url') or ''
              if not media_path.startswith('media/'):
                  continue
              raw_url = 'https://raw.githubusercontent.com/sinavm/sinavm/main/' + media_path
              request = urllib.request.Request(raw_url, headers={'User-Agent': 'SiNAVM-config-sync'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  data = response.read()
              if len(data) < 100 or (b'<client>' not in data[:20000] and b'remote ' not in data[:20000]):
                  raise SystemExit(f'invalid OpenVPN config: {item.get("original_name")!r}')
              filename = f'openvpn-{i:02d}.ovpn'
              (folder / filename).write_bytes(data)
              published.append({
                  'id': item.get('id'),
                  'name': item.get('original_name') or filename,
                  'filename': filename,
                  'download': filename,
                  'size': len(data),
                  'date': item.get('date'),
                  'date_label': item.get('date_label'),
                  'source': item.get('link') or 'https://t.me/sinavm'
              })
          (folder / 'index.json').write_text(json.dumps(published, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'published {len(published)} OpenVPN configs')
          PY
      - name: Commit if changed
        run: |
          git config user.name sinavm
          git config user.email sina.bb2006@gmail.com
          git add sinavm.npvs sinavm-nv_01.npv LAST_SYNC.txt hc/ openvpn/
          git rm -f --ignore-unmatch melishekan.npvs melishekan-nv_01.npv || true
          git commit -m "sync: latest configs including HTTP Custom and OpenVPN from sinavm" || echo nochange
          git push
